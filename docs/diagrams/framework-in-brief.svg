<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Corpus Iuris in brief</title>
<desc id="d">The whole system as two ideas. First, write each standing instruction down once and give it a name distinctive enough to cite. Second, hand each agent one piece of work and nothing else.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  .title{font-family:Palatino,"Palatino Linotype","Book Antiqua",Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.006em}
  .ink{fill:#1f2328}.mut{fill:#656d76}.sec{fill:#0969da}
  .card{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}
  .row{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
  .ln{fill:none;stroke:#d0d7de;stroke-width:1}
  @media (prefers-color-scheme:dark){
    .ink{fill:#e6edf3}.mut{fill:#8b949e}.sec{fill:#58a6ff}
    .card{fill:#161b22;stroke:#30363d}
    .row{fill:#0d1117;stroke:#30363d}
    .ln{stroke:#30363d}
  }
</style>

<!-- ============ header — title set in the deck's h2 face at the deck's h2 position ============ -->
<text x="92" y="131" class="ink title" font-size="38">Corpus Iuris: Unambiguous rules, tightly focused scope</text>

<!-- ============ idea one ============ -->
<rect class="card" x="92" y="198" width="534" height="420" rx="6"/>
<text x="126" y="252" class="mono sec" font-size="24" font-weight="600">1</text>
<text x="126" y="298" class="ink" font-size="27" font-weight="600">Give each rule a name</text>
<text x="126" y="346" class="mut" font-size="15">You have written the same standing instructions many</text>
<text x="126" y="370" class="mut" font-size="15">times, in slightly different words. They had nowhere</text>
<text x="126" y="394" class="mut" font-size="15">to live: an instruction you retype cannot be cited,</text>
<text x="126" y="418" class="mut" font-size="15">and it competes with everything else present.</text>

<rect class="row" x="116" y="510" width="486" height="84" rx="5"/>
<text x="142" y="544" class="ink" font-size="17" font-weight="600">Say it once. Point at it after that.</text>
<text x="142" y="568" class="mut" font-size="13">Picking a name that cannot be mistaken is the hard part.</text>

<!-- ============ idea two ============ -->
<rect class="card" x="654" y="198" width="534" height="420" rx="6"/>
<text x="688" y="252" class="mono sec" font-size="24" font-weight="600">2</text>
<text x="688" y="298" class="ink" font-size="27" font-weight="600">Show each agent less</text>
<text x="688" y="346" class="mut" font-size="15">Cut the work into pieces small enough that one agent</text>
<text x="688" y="370" class="mut" font-size="15">can hold a whole piece, then hand it that piece and</text>
<text x="688" y="394" class="mut" font-size="15">nothing else. The nearby work, with the same files</text>
<text x="688" y="418" class="mut" font-size="15">and the same words, already finished, is the most</text>
<text x="688" y="442" class="mut" font-size="15">convincing distraction there is.</text>

<rect class="row" x="678" y="510" width="486" height="84" rx="5"/>
<text x="704" y="544" class="ink" font-size="17" font-weight="600">What you leave out is attention you get back.</text>
<text x="704" y="568" class="mut" font-size="13">Pruning is the feature here, not an optimisation.</text>

</svg>
