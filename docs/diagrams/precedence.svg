<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Context Hierarchy</title>
<desc id="d">Four ranks decide which instruction governs a conflict. User instructions sit above every precept; inside the ranks below, the more specific ambit wins.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  .title{font-family:Palatino,"Palatino Linotype","Book Antiqua",Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.006em}
  .ink{fill:#1f2328}.mut{fill:#656d76}.sec{fill:#0969da}.kome{fill:#b42318}
  .card{fill:#f6f8fa;stroke:#d0d7de}
  .panel{fill:#ffffff;stroke:#d0d7de}
  .ln{fill:none;stroke:#8c959f;stroke-width:1.5}
  .step{fill:none;stroke:#8c959f;stroke-width:1.5}
  .ah{fill:#8c959f}
  @media (prefers-color-scheme:dark){
    .ink{fill:#e6edf3}.mut{fill:#8b949e}.sec{fill:#58a6ff}.kome{fill:#ff7b72}
    .card{fill:#161b22;stroke:#30363d}.panel{fill:#0d1117;stroke:#30363d}
    .ln{stroke:#6e7681}.step{stroke:#6e7681}.ah{fill:#6e7681}
  }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" class="ah"/>
  </marker>
</defs>

<!-- ============ header — title set in the deck's h2 face at the deck's h2 position ============ -->
<text x="92" y="131" class="ink title" font-size="38">Context Hierarchy</text>
<text x="92" y="170" class="mut" font-size="21"><tspan font-style="italic">Lex specialis derogat legi generali</tspan>: the specific displaces the general; the ambit ladder supplies the ranking.</text>

<!-- ============ rank stack ============ -->
<text x="142" y="232" class="mut" font-size="14">Ranked highest first.</text>

<circle class="step" cx="112" cy="286" r="15"/><text x="112" y="291" class="mut" font-size="13" text-anchor="middle">1</text>
<circle class="step" cx="112" cy="382" r="15"/><text x="112" y="387" class="mut" font-size="13" text-anchor="middle">2</text>
<circle class="step" cx="112" cy="478" r="15"/><text x="112" y="483" class="mut" font-size="13" text-anchor="middle">3</text>
<circle class="step" cx="112" cy="574" r="15"/><text x="112" y="579" class="mut" font-size="13" text-anchor="middle">4</text>

<rect class="card" x="142" y="248" width="470" height="76" rx="6"/>
<text x="164" y="280" class="ink" font-size="19" font-weight="600">User Instructions</text>
<text x="164" y="306" class="mut" font-size="14.5">The live instruction of the session.</text>

<rect class="card" x="142" y="344" width="470" height="76" rx="6"/>
<text x="164" y="376" class="ink" font-size="19" font-weight="600">Doctrine</text>
<text x="164" y="402" class="mut" font-size="14.5">Every provision: <tspan class="mono sec">§</tspan> <tspan class="mono kome">※</tspan> <tspan class="mono ink">⊢</tspan> <tspan class="mono ink">⊨</tspan></text>

<rect class="card" x="142" y="440" width="470" height="76" rx="6"/>
<text x="164" y="472" class="ink" font-size="19" font-weight="600">Rubric</text>
<text x="164" y="498" class="mut" font-size="14.5">The rest of canon.</text>

<rect class="card" x="142" y="536" width="470" height="76" rx="6"/>
<text x="164" y="568" class="ink" font-size="19" font-weight="600">Remaining precepts</text>
<text x="164" y="594" class="mut" font-size="14.5">Everything else that binds.</text>

<!-- bracket to the ambit panel -->
<path class="ln" d="M620 344 L632 344 L632 612 L620 612"/>
<path class="ln" d="M632 478 L668 478" marker-end="url(#ar)"/>

<!-- ============ ambit panel ============ -->
<rect class="panel" x="680" y="346" width="508" height="246" rx="6"/>
<text x="700" y="378" class="ink" font-size="17" font-weight="600">Inside ranks 2&#8211;4, ambit decides</text>
<line x1="700" y1="394" x2="1168" y2="394" class="ln" stroke-width="1"/>

<text x="700" y="426" class="ink" font-size="16.5" font-weight="600">Agent</text>
<text x="830" y="426" class="mut" font-size="15">one agent</text>
<text x="700" y="460" class="ink" font-size="16.5" font-weight="600">Project</text>
<text x="830" y="460" class="mut" font-size="15">one project</text>
<text x="700" y="494" class="ink" font-size="16.5" font-weight="600">Instance</text>
<text x="830" y="494" class="mut" font-size="15">one installation</text>
<text x="700" y="528" class="ink" font-size="16.5" font-weight="600">Universal</text>
<text x="830" y="528" class="mut" font-size="15">every installation</text>

<text x="700" y="564" class="mut" font-size="14">Tied on ambit? A named lingua beats a blank one.</text>

<!-- ============ footer ============ -->
<text x="92" y="680" class="mut" font-size="12.5">github.com/EricBLivingston/corpus-iuris</text>
<text x="1188" y="680" class="mut" font-size="12.5" text-anchor="end">Corpus Iuris © 2026 Eric Livingston · CC BY-SA 4.0</text>
</svg>
