<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Give every rule an anchor</title>
<desc id="d">A provision token has four positions: instrument, ambit, lingua and number.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  .title{font-family:Palatino,"Palatino Linotype","Book Antiqua",Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.006em}
  .ink{fill:#1f2328}.mut{fill:#656d76}.sec{fill:#0969da}.kome{fill:#b42318}
  .amb{fill:#8250df}.lin{fill:#1a7f37}.num{fill:#9a6700}
  .ln{stroke:#d0d7de;fill:none;stroke-width:1}
  .card{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}
  @media (prefers-color-scheme:dark){
    .ink{fill:#e6edf3}.mut{fill:#8b949e}.sec{fill:#58a6ff}.kome{fill:#ff7b72}
    .amb{fill:#a371f7}.lin{fill:#3fb950}.num{fill:#d29922}
    .ln{stroke:#30363d}.card{fill:#161b22;stroke:#30363d}
  }
</style>

<!-- ============ header — title set in the deck's h2 face at the deck's h2 position ============ -->
<text x="92" y="131" class="ink title" font-size="38">Give every rule an anchor</text>
<text x="92" y="170" class="mut" font-size="21">The <tspan font-style="italic">provision token</tspan>: the single source of truth the model zeroes in on. Four positions, read left to right.</text>

<!-- ============ the token ============ -->
<text x="554" y="266" class="mono sec" font-size="72" text-anchor="middle">§</text>
<text x="597" y="266" class="mono amb" font-size="72" text-anchor="middle">I</text>
<text x="661" y="266" class="mono lin" font-size="72" text-anchor="middle">py</text>
<text x="726" y="266" class="mono num" font-size="72" text-anchor="middle">4</text>

<!-- brackets -->
<path class="ln" d="M532 278 L532 286 L575 286 L575 278"/>
<path class="ln" d="M575 278 L575 286 L618 286 L618 278"/>
<path class="ln" d="M618 278 L618 286 L704 286 L704 278"/>
<path class="ln" d="M704 278 L704 286 L747 286 L747 278"/>

<!-- leaders -->
<path class="ln" d="M554 286 L554 306 L217 316 L217 330"/>
<path class="ln" d="M597 286 L597 306 L499 316 L499 330"/>
<path class="ln" d="M661 286 L661 306 L781 316 L781 330"/>
<path class="ln" d="M726 286 L726 306 L1063 316 L1063 330"/>

<!-- ============ position cards ============ -->
<rect class="card" x="92"  y="330" width="250" height="140" rx="6"/>
<rect class="card" x="374" y="330" width="250" height="140" rx="6"/>
<rect class="card" x="656" y="330" width="250" height="140" rx="6"/>
<rect class="card" x="938" y="330" width="250" height="140" rx="6"/>

<text x="217" y="362" class="ink" font-size="16" font-weight="600" text-anchor="middle">Instrument</text>
<text x="217" y="400" class="mono" font-size="21" text-anchor="middle"><tspan class="sec">§</tspan><tspan class="mut"> · </tspan><tspan class="kome">※</tspan><tspan class="mut"> · </tspan><tspan class="ink">⊢</tspan><tspan class="mut"> · </tspan><tspan class="ink">⊨</tspan></text>
<text x="217" y="434" class="mut" font-size="14" text-anchor="middle">Always present.</text>
<text x="217" y="454" class="mut" font-size="14" text-anchor="middle">What kind of precept.</text>

<text x="499" y="362" class="amb" font-size="16" font-weight="600" text-anchor="middle">Ambit</text>
<text x="499" y="400" class="mono" font-size="21" text-anchor="middle"><tspan class="amb">A</tspan><tspan class="mut"> · </tspan><tspan class="amb">P</tspan><tspan class="mut"> · </tspan><tspan class="amb">I</tspan></text>
<text x="499" y="434" class="mut" font-size="14" text-anchor="middle">Blank = universal.</text>
<text x="499" y="454" class="mut" font-size="14" text-anchor="middle">How far it reaches.</text>

<text x="781" y="362" class="lin" font-size="16" font-weight="600" text-anchor="middle">Lingua</text>
<text x="781" y="400" class="mono" font-size="21" text-anchor="middle"><tspan class="lin">md</tspan><tspan class="mut"> · </tspan><tspan class="lin">py</tspan><tspan class="mut"> · </tspan><tspan class="lin">rs</tspan></text>
<text x="781" y="434" class="mut" font-size="14" text-anchor="middle">Blank = every syntax.</text>
<text x="781" y="454" class="mut" font-size="14" text-anchor="middle">Which content it binds.</text>

<text x="1063" y="362" class="num" font-size="16" font-weight="600" text-anchor="middle">Number</text>
<text x="1063" y="400" class="mono" font-size="21" text-anchor="middle"><tspan class="num">1</tspan><tspan class="mut"> · </tspan><tspan class="num">2</tspan><tspan class="mut"> · </tspan><tspan class="num">3</tspan></text>
<text x="1063" y="434" class="mut" font-size="14" text-anchor="middle">Always present.</text>
<text x="1063" y="454" class="mut" font-size="14" text-anchor="middle">Index in its namespace.</text>

<!-- ============ reading examples ============ -->
<line class="ln" x1="92" y1="498" x2="1188" y2="498"/>
<text x="92" y="528" class="ink" font-size="16" font-weight="600">Reading a token</text>

<text x="217" y="576" class="mono" font-size="26" text-anchor="middle"><tspan class="sec">§</tspan><tspan class="num">5</tspan></text>
<text x="217" y="604" class="mut" font-size="14" text-anchor="middle">universal directive,</text>
<text x="217" y="624" class="mut" font-size="14" text-anchor="middle">binds all content</text>

<text x="499" y="576" class="mono" font-size="26" text-anchor="middle"><tspan class="sec">§</tspan><tspan class="lin">md</tspan><tspan class="num">2</tspan></text>
<text x="499" y="604" class="mut" font-size="14" text-anchor="middle">universal directive,</text>
<text x="499" y="624" class="mut" font-size="14" text-anchor="middle">Markdown only</text>

<text x="781" y="576" class="mono" font-size="26" text-anchor="middle"><tspan class="sec">§</tspan><tspan class="amb">I</tspan><tspan class="num">7</tspan></text>
<text x="781" y="604" class="mut" font-size="14" text-anchor="middle">one installation,</text>
<text x="781" y="624" class="mut" font-size="14" text-anchor="middle">every lingua</text>

<text x="1063" y="576" class="mono" font-size="26" text-anchor="middle"><tspan class="kome">※</tspan><tspan class="amb">A</tspan><tspan class="num">3</tspan></text>
<text x="1063" y="604" class="mut" font-size="14" text-anchor="middle">binds one agent,</text>
<text x="1063" y="624" class="mut" font-size="14" text-anchor="middle">its conduct alone</text>

<!-- ============ footer ============ -->
<text x="92" y="680" class="mut" font-size="12.5">github.com/EricBLivingston/corpus-iuris</text>
<text x="1188" y="680" class="mut" font-size="12.5" text-anchor="end">Corpus Iuris © 2026 Eric Livingston · CC BY-SA 4.0</text>
</svg>
