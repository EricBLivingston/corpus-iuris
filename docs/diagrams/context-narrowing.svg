<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Orchestration Context Pruning: Supporting long workflows</title>
<desc id="d">Two panels comparing an orchestrator window that accumulates output across phases against one that holds only file paths.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .title{font-family:Palatino,"Palatino Linotype","Book Antiqua",Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.006em}
  .ink{fill:#1f2328}.mut{fill:#656d76}.kome{fill:#b42318}
  .panel{fill:#f6f8fa;stroke:#d0d7de}
  .plan{fill:#d0d7de}
  .out{fill:#0969da}
  .axis{stroke:#8c959f;stroke-width:1.2}
  .lim{stroke:#b42318;stroke-width:1.4;stroke-dasharray:5 4}
  @media (prefers-color-scheme:dark){
    .ink{fill:#e6edf3}.mut{fill:#8b949e}.kome{fill:#ff7b72}
    .panel{fill:#161b22;stroke:#30363d}
    .plan{fill:#30363d}.out{fill:#58a6ff}
    .axis{stroke:#6e7681}.lim{stroke:#ff7b72}
  }
</style>

<!-- ============ header — title set in the deck's h2 face at the deck's h2 position ============ -->
<text x="92" y="131" class="ink title" font-size="38">Orchestration Context Pruning: Supporting long workflows</text>
<text x="92" y="170" class="mut" font-size="21">An orchestrator that reads everything will rapidly exhaust its context.</text>
<text x="92" y="201" class="mut" font-size="21">Careful context management is essential.</text>

<!-- ============ LEFT PANEL ============ -->
<rect class="panel" x="92" y="232" width="530" height="368" rx="7"/>
<text x="114" y="264" class="ink" font-size="18" font-weight="600">Reads what it dispatches</text>

<line class="lim" x1="114" y1="345" x2="600" y2="345"/>
<text x="114" y="337" class="kome" font-size="13.5">attention thins past here</text>
<line class="axis" x1="114" y1="560" x2="600" y2="560"/>

<rect class="plan" x="114" y="518" width="96" height="42"/>
<rect class="out"  x="114" y="503" width="96" height="15"/>
<rect class="plan" x="242" y="518" width="96" height="42"/>
<rect class="out"  x="242" y="437" width="96" height="81"/>
<rect class="plan" x="370" y="518" width="96" height="42"/>
<rect class="out"  x="370" y="361" width="96" height="157"/>
<rect class="plan" x="498" y="518" width="96" height="42"/>
<rect class="out"  x="498" y="280" width="96" height="238"/>

<text x="162" y="588" class="mut" font-size="13.5" text-anchor="middle">phase 1</text>
<text x="290" y="588" class="mut" font-size="13.5" text-anchor="middle">phase 2</text>
<text x="418" y="588" class="mut" font-size="13.5" text-anchor="middle">phase 3</text>
<text x="546" y="588" class="mut" font-size="13.5" text-anchor="middle">phase 4</text>

<!-- ============ RIGHT PANEL ============ -->
<rect class="panel" x="658" y="232" width="530" height="368" rx="7"/>
<text x="680" y="264" class="ink" font-size="18" font-weight="600">Passes paths instead</text>

<line class="lim" x1="680" y1="345" x2="1166" y2="345"/>
<line class="axis" x1="680" y1="560" x2="1166" y2="560"/>

<rect class="plan" x="680" y="518" width="96" height="42"/>
<rect class="out"  x="680" y="515" width="96" height="3"/>
<rect class="plan" x="808" y="518" width="96" height="42"/>
<rect class="out"  x="808" y="512" width="96" height="6"/>
<rect class="plan" x="936" y="518" width="96" height="42"/>
<rect class="out"  x="936" y="514" width="96" height="4"/>
<rect class="plan" x="1064" y="518" width="96" height="42"/>
<rect class="out"  x="1064" y="511" width="96" height="7"/>

<text x="728" y="588" class="mut" font-size="13.5" text-anchor="middle">phase 1</text>
<text x="856" y="588" class="mut" font-size="13.5" text-anchor="middle">phase 2</text>
<text x="984" y="588" class="mut" font-size="13.5" text-anchor="middle">phase 3</text>
<text x="1112" y="588" class="mut" font-size="13.5" text-anchor="middle">phase 4</text>

<!-- ============ legend + conclusion ============ -->
<rect class="plan" x="92" y="622" width="14" height="14"/>
<text x="114" y="634" class="mut" font-size="14">the phase spec it was handed</text>
<rect class="out" x="400" y="622" width="14" height="14"/>
<text x="422" y="634" class="mut" font-size="14">output accumulated</text>
<text x="1188" y="634" class="mut" font-size="14" text-anchor="end">Managing orchestrator context supports very long workflows with no degradation.</text>

<!-- ============ footer ============ -->
<text x="92" y="680" class="mut" font-size="12.5">github.com/EricBLivingston/corpus-iuris</text>
<text x="1188" y="680" class="mut" font-size="12.5" text-anchor="end">Corpus Iuris © 2026 Eric Livingston · CC BY-SA 4.0</text>
</svg>
