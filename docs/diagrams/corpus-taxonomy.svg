<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">The anatomy of the corpus</title>
<desc id="d">Nested sets: corpus contains precepts, which contain canon, which divides into doctrine and rubric.</desc>
<style>
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  .title{font-family:Palatino,"Palatino Linotype","Book Antiqua",Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.006em}
  .ink{fill:#1f2328}.mut{fill:#656d76}.sec{fill:#0969da}.kome{fill:#b42318}
  .l0{fill:none;stroke:#8c959f;stroke-width:1.5}
  .l1{fill:#f6f8fa;stroke:#d0d7de}
  .l2{fill:#ffffff;stroke:#d0d7de}
  .dash{fill:none;stroke:#8c959f;stroke-width:1.5;stroke-dasharray:5 4}
  @media (prefers-color-scheme:dark){
    .ink{fill:#e6edf3}.mut{fill:#8b949e}.sec{fill:#58a6ff}.kome{fill:#ff7b72}
    .l0{stroke:#6e7681}.l1{fill:#161b22;stroke:#30363d}
    .l2{fill:#0d1117;stroke:#30363d}
    .dash{stroke:#6e7681}
  }
</style>

<!-- ============ header — title set in the deck's h2 face at the deck's h2 position ============ -->
<text x="92" y="131" class="ink title" font-size="38">The anatomy of the corpus</text>
<text x="92" y="170" class="mut" font-size="21">A nested, non-conflicting taxonomy for categorising the context of an AI agent.</text>

<!-- ============ the nest ============ -->
<rect class="l0" x="92" y="200" width="1096" height="378" rx="8"/>
<text x="110" y="232" class="ink" font-size="18" font-weight="600">Corpus <tspan class="mut" font-weight="400">— all live content: code, tests, docs, adventitia</tspan></text>

<rect class="l1" x="120" y="248" width="1040" height="316" rx="7"/>
<text x="138" y="280" class="ink" font-size="18" font-weight="600">Precepts <tspan class="mut" font-weight="400">— all corpus that binds</tspan></text>

<rect class="l2" x="148" y="296" width="984" height="196" rx="6"/>
<text x="166" y="328" class="ink" font-size="18" font-weight="600">Canon <tspan class="mut" font-weight="400">— presence guaranteed, so a citation always resolves in context</tspan></text>

<rect class="l1" x="172" y="344" width="470" height="134" rx="6"/>
<text x="192" y="370" class="ink" font-size="18" font-weight="600">Provisions</text>
<text x="192" y="402" class="mono" font-size="23"><tspan class="sec">§</tspan><tspan class="mut">  </tspan><tspan class="kome">※</tspan><tspan class="mut">  </tspan><tspan class="ink">⊢</tspan><tspan class="mut">  </tspan><tspan class="ink">⊨</tspan></text>
<text x="192" y="430" class="mut" font-size="14.5">Canon's instrument-labelled precepts. Each carries a token,</text>
<text x="192" y="450" class="mut" font-size="14.5">so it can be cited from anywhere instead of quoted.</text>
<text x="192" y="472" class="ink" font-size="14.5">Doctrine <tspan class="mut">is the set of all of them.</tspan></text>

<rect class="l1" x="666" y="344" width="442" height="134" rx="6"/>
<text x="686" y="370" class="ink" font-size="18" font-weight="600">Rubric</text>
<text x="686" y="398" class="mut" font-size="14.5">The rest of canon. Instructs and prescribes</text>
<text x="686" y="418" class="mut" font-size="14.5">procedure, minting nothing.</text>

<rect class="l2" x="680" y="428" width="414" height="42" rx="5"/>
<text x="694" y="445" class="ink" font-size="14" font-weight="600">Adventitia: <tspan class="mut" font-weight="400" font-size="12.5">rubric that arrives by harness injection</tspan></text>
<text x="694" y="463" class="mut" font-size="12.5">System prompts, tool descriptions.</text>

<rect class="l2" x="148" y="506" width="984" height="50" rx="6"/>
<text x="166" y="528" class="ink" font-size="16" font-weight="600">Deuterocanonical</text>
<text x="166" y="549" class="mut" font-size="14.5">Outside canon; its presence is not guaranteed. It binds once read.</text>

<rect class="dash" x="92" y="590" width="1096" height="60" rx="8"/>
<text x="110" y="615" class="ink" font-size="18" font-weight="600">Dead code: <tspan class="mut" font-weight="400">archived, superseded, or reached by nothing live</tspan></text>
<text x="110" y="641" class="mut" font-size="14.5">Present on disk, but outside the corpus entirely.</text>

<!-- ============ footer ============ -->
<text x="92" y="680" class="mut" font-size="12.5">github.com/EricBLivingston/corpus-iuris</text>
<text x="1188" y="680" class="mut" font-size="12.5" text-anchor="end">Corpus Iuris © 2026 Eric Livingston · CC BY-SA 4.0</text>
</svg>
